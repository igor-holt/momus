name = "momus-deployer"
main = "src/index.ts"
compatibility_date = "2026-09-13"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "momus-usage"
database_id = "4990cb80-e17f-4e43-bc4f-e8b648040ee1"

[[kv_namespaces]]
binding = "API_KEYS"
id = "c844f44eabff4e8c87f22906a18c654b"

[[kv_namespaces]]
binding = "METER_CURSOR"
id = "fef4a970f1454b279d116785e89f620d"

[durable_objects]
bindings = [{ name = "USAGE_DO", class_name = "UsageAggregator" }]

[[migrations]]
tag = "v2-e2"
new_sqlite_classes = ["UsageAggregator"]

[triggers]
crons = ["*/30 * * * *"]

[observability]
enabled = true
